<!-- メニューバーのアイコンの元データ。座標は 18pt。AppIcon.svg のモチーフを単色に単純化したテンプレート画像で、色は使わず不透明度だけで濃淡を付ける(実際の色は macOS がライト/ダークに合わせて決める)。
     モチーフ: フリックの輪(右の区画を選択中)、中心の輪、右へ伸びる線、1つの候補。 -->
