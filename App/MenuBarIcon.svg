<path d="M10.14 5.11 A5.5 5.5 0 0 1 10.14 12.89" fill="none" stroke="#000" stroke-width="1.5"/>
<circle cx="6.25" cy="9" r="1.75" fill="none" stroke="#000" stroke-width="1"/>
<line x1="8" y1="9" x2="14" y2="9" stroke="#000" stroke-width="1"/>
<rect x="14" y="7" width="3.75" height="4" rx="1" fill="#000"/>
